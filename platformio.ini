; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = rpipico2

; Raspberry Pi Pico 2 (RP2350) + ST7789 240x320 + ADC GP26
[env:rpipico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#aa70b802be8851668053d4f09734e4089fe41932
board = rpipico2
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
lib_deps = lovyan03/LovyanGFX@1.2.26
build_src_filter =
	+<audio.cpp>
	+<decode.cpp>
	+<decoder.cpp>
	+<display.cpp>
	+<dsp.cpp>
	+<main.cpp>
	+<scopelog_stub.cpp>
